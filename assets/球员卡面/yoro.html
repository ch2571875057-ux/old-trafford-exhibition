<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:14px; background:#15161a; padding:24px; }
  h1 { color:#e8e2dc; font-size:15px; font-weight:400; letter-spacing:2px; margin:0; }
  small { color:#8b857e; font-size:12px; }

.pcell { perspective:1200px; width:340px; max-width:100%; }
.pflip { position:relative; width:340px; height:500px; transform-style:preserve-3d;
         transition:transform .7s cubic-bezier(.2,.7,.2,1); outline:none; }
.pflip.is-flipped { transform: rotateY(180deg); }
.pflip:focus-visible { outline:2px solid #c8102e; outline-offset:6px; border-radius:18px; }
.pface { position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; overflow:hidden;
         color:#f7efe9; background:#1a1113;
         box-shadow:0 24px 48px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.12) inset;
         border:1px solid rgba(255,255,255,.18); }
.pphoto { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 16%; }
.pshade { position:absolute; inset:0;
          background:linear-gradient(to top, rgba(12,6,8,.88) 0%, rgba(12,6,8,.42) 26%, transparent 48%),
                     linear-gradient(to bottom, rgba(12,6,8,.42) 0%, transparent 22%); }
.pchip { display:inline-flex; align-items:center; justify-content:center; min-width:38px; height:26px;
         padding:0 8px; border-radius:6px; background:rgba(16,10,12,.62);
         border:1px solid rgba(255,255,255,.35); font-size:12.5px; font-weight:500;
         letter-spacing:1.5px; backdrop-filter:blur(3px); }
.prow { display:flex; align-items:center; gap:8px; }
.pline { position:relative; padding-left:16px; }
.pline::before { content:""; position:absolute; left:2px; top:2px; width:6px; height:6px;
                 border-radius:50%; background:#c8102e; box-shadow:0 0 0 2px rgba(200,16,46,.35); }
.pstats { display:flex; gap:6px; }
.pstat { flex:1; text-align:center; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.22);
         border-radius:10px; padding:8px 4px; }
.pstat b { display:block; font-size:20px; font-weight:500; font-variant-numeric:tabular-nums; }
.pstat small { font-size:10.5px; opacity:.72; letter-spacing:1px; }
.pbadge { font-size:11px; padding:4px 10px; border:1px solid rgba(255,255,255,.3); border-radius:999px; }
.pback { transform: rotateY(180deg);
         background:radial-gradient(140% 90% at 85% -10%, rgba(255,255,255,.10), transparent 55%),
                    linear-gradient(200deg, #1c1210 0%, #2a1512 55%, #120c0a 100%); }
@media (prefers-reduced-motion: reduce) { .pflip { transition:none; } }
